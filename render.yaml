services:
  - type: web
    name: norv-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: norv-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: ALLOWED_ORIGINS
        value: https://admin.shopnorv.com,https://shopnorv.com,https://www.shopnorv.com
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        value: shopnorv@gmail.com
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: norv-db
    databaseName: norv_db
    user: norv_admin
